name: Reusable Integration Tests

on:
  workflow_call:
    inputs:
      python-version:
        description: Python version to run integration tests with
        required: true
        type: string

jobs:
  integration-tests:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up uv
        uses: astral-sh/setup-uv@v4
        with:
          python-version: ${{ inputs.python-version }}
          enable-cache: true

      - name: Install dependencies
        run: uv sync --dev

      - name: Build distribution artifacts
        run: uv build

      - name: Verify package installs and CLI works in clean environment
        run: |
          uv venv .venv-integration
          uv pip install --python .venv-integration/bin/python dist/*.whl
          .venv-integration/bin/python -c "import ai_vision_tool; print(ai_vision_tool.__version__)"
          .venv-integration/bin/ai-vision-tool --show-examples --example-name AutoOrient
          .venv-integration/bin/python -m ai_vision_tool --show-examples --example-category preprocessing

      - name: Run integration test suite
        run: |
          uv run pytest \
            tests/test_imports.py \
            tests/test_core_components.py \
            tests/test_capture_components.py \
            tests/test_cli_file_processing.py \
            --junitxml=integration-test-results-${{ inputs.python-version }}.xml \
            -v

      - name: Upload integration test results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: integration-test-results-${{ inputs.python-version }}
          path: integration-test-results-${{ inputs.python-version }}.xml
          retention-days: 14
