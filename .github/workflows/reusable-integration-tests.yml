name: Reusable Integration Tests

on:
  workflow_call:
    inputs:
      python-version:
        description: Python version to run integration tests with
        required: true
        type: string

jobs:
  integration-tests:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ inputs.python-version }}

      - name: Install Poetry
        run: python -m pip install poetry build

      - name: Install dependencies
        run: poetry install --with dev

      - name: Build distribution artifacts
        run: poetry run python -m build

      - name: Install built wheel in clean virtualenv
        run: |
          python -m venv .venv-integration
          . .venv-integration/bin/activate
          python -m pip install --upgrade pip
          pip install dist/*.whl
          python -c "import visionflow; print(visionflow.__version__)"
          ai-vision-flow --show-examples --example-name AutoOrient
          python -m visionflow --show-examples --example-category components

      - name: Run integration-oriented test suite
        run: |
          poetry run pytest \
            tests/test_core_components.py \
            tests/test_capture_components.py
