name: Reusable Security Checks

on:
  workflow_call:
    inputs:
      python-version:
        description: Python version to run security checks with
        required: false
        default: "3.11"
        type: string

jobs:
  # ── 1. Dependency vulnerability audit ──────────────────────────────────────
  dependency-audit:
    name: Dependency Audit (pip-audit)
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up uv
        uses: astral-sh/setup-uv@v4
        with:
          python-version: ${{ inputs.python-version }}
          enable-cache: true

      - name: Install dependencies
        run: uv sync --dev

      - name: Run pip-audit (OSV + PyPI Advisory DB)
        run: |
          uv run --with pip-audit pip-audit \
            --format json \
            --output pip-audit-results.json \
            --skip-editable \
            || true

      - name: Upload pip-audit results artifact
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: pip-audit-results
          path: pip-audit-results.json
          retention-days: 14

  # ── 2. Static Application Security Testing ─────────────────────────────────
  sast:
    name: SAST (Bandit + Semgrep)
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up uv
        uses: astral-sh/setup-uv@v4
        with:
          python-version: ${{ inputs.python-version }}
          enable-cache: true

      - name: Install dependencies
        run: uv sync --dev

      - name: Run Bandit (Python SAST)
        run: |
          uv run --with bandit bandit \
            -r ai_vision_tool \
            -f json \
            -o bandit-results.json \
            --severity-level medium \
            --confidence-level medium \
            || true

      - name: Run Semgrep (community rules)
        run: |
          uv run --with semgrep semgrep scan \
            --config=p/python \
            --config=p/secrets \
            --sarif \
            --output semgrep.sarif \
            ai_vision_tool/ \
            || true

      - name: Upload SAST report artifacts
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: sast-reports
          path: |
            bandit-results.json
            semgrep.sarif
          retention-days: 14

      - name: Fail on high-severity Bandit findings
        run: |
          uv run --with bandit bandit \
            -r ai_vision_tool \
            --severity-level high \
            --confidence-level high \
            -q

  # ── 3. Secret scanning ──────────────────────────────────────────────────────
  secret-scan:
    name: Secret Scan (Gitleaks)
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Run Gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
