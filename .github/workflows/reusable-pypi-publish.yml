name: Reusable PyPI Publish

on:
  workflow_call:
    inputs:
      python-version:
        description: Python version to build and publish with
        required: false
        default: "3.11"
        type: string
      repository_url:
        description: Optional repository URL for TestPyPI or custom indexes
        required: false
        default: ""
        type: string

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    environment:
      name: ${{ inputs.repository_url != '' && 'testpypi' || 'pypi' }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up uv
        uses: astral-sh/setup-uv@v4
        with:
          python-version: ${{ inputs.python-version }}
          enable-cache: true

      - name: Verify git tag matches pyproject.toml version
        if: github.ref_type == 'tag'
        run: |
          TAG="${GITHUB_REF_NAME}"
          PYPROJECT_VERSION="v$(grep -m1 '^version = ' pyproject.toml | sed 's/version = "\(.*\)"/\1/')"
          echo "Git tag:              $TAG"
          echo "pyproject.toml:       $PYPROJECT_VERSION"
          if [ "$TAG" != "$PYPROJECT_VERSION" ]; then
            echo "ERROR: Tag '$TAG' does not match pyproject.toml version '$PYPROJECT_VERSION'"
            exit 1
          fi
          echo "Version check passed."

      - name: Build distributions (sdist + wheel)
        run: uv build

      - name: Validate distributions with twine
        run: |
          uv tool install twine
          uv tool run twine check dist/*

      - name: List distribution artifacts
        run: ls -lh dist/

      - name: Publish to PyPI (trusted publisher / OIDC)
        if: ${{ inputs.repository_url == '' }}
        uses: pypa/gh-action-pypi-publish@release/v1

      - name: Publish to alternate repository
        if: ${{ inputs.repository_url != '' }}
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          repository-url: ${{ inputs.repository_url }}

      - name: Upload distribution artifacts
        uses: actions/upload-artifact@v4
        with:
          name: dist-${{ inputs.python-version }}
          path: dist/
          retention-days: 30
