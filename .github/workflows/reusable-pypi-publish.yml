name: Reusable PyPI Publish

on:
  workflow_call:
    inputs:
      python-version:
        description: Python version to build and publish with
        required: false
        default: "3.11"
        type: string
      repository_url:
        description: Optional repository URL for TestPyPI or custom indexes
        required: false
        default: ""
        type: string

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    environment:
      name: pypi

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ inputs.python-version }}

      - name: Install build tooling
        run: python -m pip install poetry build twine

      - name: Build distributions
        run: poetry run python -m build

      - name: Validate distributions
        run: python -m twine check dist/*

      - name: Publish to PyPI
        if: ${{ inputs.repository_url == '' }}
        uses: pypa/gh-action-pypi-publish@release/v1

      - name: Publish to alternate repository
        if: ${{ inputs.repository_url != '' }}
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          repository-url: ${{ inputs.repository_url }}
