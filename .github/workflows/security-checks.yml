name: Security Checks

on:
  push:
    branches:
      - main
  pull_request:
  schedule:
    - cron: "0 3 * * 1"  # every Monday at 03:00 UTC
  workflow_dispatch:

jobs:
  security-checks:
    permissions:
      contents: read
      security-events: write
    uses: ./.github/workflows/reusable-security-checks.yml
    with:
      python-version: "3.11"
