name: Unit Tests

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

jobs:
  unit-tests:
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    uses: ./.github/workflows/reusable-unit-tests.yml
    with:
      python-version: ${{ matrix.python-version }}
