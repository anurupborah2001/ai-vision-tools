name: Semantic Versioning

# Responsibilities: version bump only.
#   1. Analyses conventional commits since the last tag
#   2. Bumps version in pyproject.toml + ai_vision_tool/__init__.py
#   3. Updates CHANGELOG.md
#   4. Commits + pushes the bump commit and the vX.Y.Z annotated tag
#
# Downstream workflows triggered by the v* tag push:
#   github-release.yml  → creates GitHub release, attaches sdist/wheel assets
#   publish-pypi.yml    → builds and publishes to PyPI via OIDC
#
# NOTE: If main is a protected branch with required status checks, set
# secrets.RELEASE_TOKEN to a PAT with repo write access and replace
# `secrets.GITHUB_TOKEN` in the checkout step below.

on:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      bump:
        description: "Version bump type (auto = analyse conventional commits)"
        required: false
        default: auto
        type: choice
        options:
          - auto
          - major
          - minor
          - patch

# Prevent concurrent release jobs; never cancel an in-progress one
concurrency:
  group: semantic-release
  cancel-in-progress: false

jobs:
  release:
    name: Cut Release
    runs-on: ubuntu-latest

    # Skip when the triggering commit is itself a release bump to prevent loops.
    # workflow_dispatch always runs (head_commit is null for manual triggers).
    if: |
      github.event_name == 'workflow_dispatch' ||
      !startsWith(github.event.head_commit.message, 'chore(release):')

    permissions:
      contents: write   # push commits, tags, create releases

    outputs:
      released: ${{ steps.bump.outputs.released }}
      version:  ${{ steps.bump.outputs.version }}
      tag:      ${{ steps.bump.outputs.tag }}
      # Downstream: github-release.yml and publish-pypi.yml are triggered
      # automatically by the v* tag push — no explicit call needed here.

    steps:
      # ── Checkout ───────────────────────────────────────────────────────────
      - name: Check out repository (full history for changelog)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      # ── Toolchain ──────────────────────────────────────────────────────────
      - name: Set up uv
        uses: astral-sh/setup-uv@v4
        with:
          python-version: "3.11"
          enable-cache: true

      - name: Install dependencies
        run: uv sync --dev

      # ── Git identity (required for cz bump to commit) ──────────────────────
      - name: Configure git identity
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      # ── Version bump ───────────────────────────────────────────────────────
      - name: Bump version and generate changelog
        id: bump
        run: |
          BUMP_INPUT="${{ inputs.bump }}"

          if [ "$BUMP_INPUT" = "major" ] || [ "$BUMP_INPUT" = "minor" ] || [ "$BUMP_INPUT" = "patch" ]; then
            # ── Forced bump (workflow_dispatch with explicit type) ──
            echo "Forced bump: ${BUMP_INPUT}"
            uv run cz bump \
              --increment "$(echo "$BUMP_INPUT" | tr '[:lower:]' '[:upper:]')" \
              --yes \
              --changelog
          else
            # ── Auto bump: analyse conventional commits since last tag ──
            echo "Auto bump: analysing commits since last tag..."
            if ! uv run cz bump --dry-run &>/dev/null; then
              echo "released=false" >> "$GITHUB_OUTPUT"
              echo "No releasable commits found since last tag. Skipping release."
              exit 0
            fi
            uv run cz bump --yes --changelog
          fi

          VERSION=$(uv run cz version --project)
          echo "released=true"      >> "$GITHUB_OUTPUT"
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "tag=v${VERSION}"    >> "$GITHUB_OUTPUT"
          echo "Bumped to: v${VERSION}"

      # ── Push commit + tag ─────────────────────────────────────────────────
      # This tag push triggers two downstream workflows automatically:
      #   • github-release.yml  (creates GitHub release + uploads dist assets)
      #   • publish-pypi.yml    (builds + publishes to PyPI)
      - name: Push version commit and tag
        if: steps.bump.outputs.released == 'true'
        run: git push origin HEAD:main --follow-tags

      # ── Summary ───────────────────────────────────────────────────────────
      - name: Write job summary
        if: always()
        run: |
          if [ "${{ steps.bump.outputs.released }}" = "true" ]; then
            {
              echo "## Version bumped: ${{ steps.bump.outputs.tag }}"
              echo ""
              echo "| Step | Status |"
              echo "|------|--------|"
              echo "| Version bump commit | pushed to \`main\` |"
              echo "| Git tag | \`${{ steps.bump.outputs.tag }}\` pushed |"
              echo "| GitHub release | triggered → **GitHub Release** workflow |"
              echo "| PyPI publish | triggered → **Publish to PyPI** workflow |"
            } >> "$GITHUB_STEP_SUMMARY"
          else
            {
              echo "## No release"
              echo "No releasable conventional commits found since the last tag."
            } >> "$GITHUB_STEP_SUMMARY"
          fi
