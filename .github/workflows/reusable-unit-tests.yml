name: Reusable Unit Tests

on:
  workflow_call:
    inputs:
      python-version:
        description: Python version to run unit tests with
        required: true
        type: string

jobs:
  unit-tests:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up uv
        uses: astral-sh/setup-uv@v4
        with:
          python-version: ${{ inputs.python-version }}
          enable-cache: true

      - name: Install dependencies
        run: uv sync --dev

      - name: Run unit tests with coverage
        run: |
          uv run --with pytest-cov pytest \
            tests/test_imports.py \
            tests/test_preprocessing_components.py \
            tests/test_basic_augmentations.py \
            tests/test_advanced_augmentations.py \
            tests/test_core_components.py \
            tests/test_labeler_components.py \
            tests/test_cli_file_processing.py \
            --cov=ai_vision_tool \
            --cov-report=xml:coverage-${{ inputs.python-version }}.xml \
            --cov-report=term-missing \
            --junitxml=unit-test-results-${{ inputs.python-version }}.xml \
            -v

      - name: Upload test results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: unit-test-results-${{ inputs.python-version }}
          path: unit-test-results-${{ inputs.python-version }}.xml
          retention-days: 14

      - name: Upload coverage report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: coverage-${{ inputs.python-version }}
          path: coverage-${{ inputs.python-version }}.xml
          retention-days: 14
