name: Reusable Unit Tests

on:
  workflow_call:
    inputs:
      python-version:
        description: Python version to run unit tests with
        required: true
        type: string

jobs:
  unit-tests:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ inputs.python-version }}

      - name: Install Poetry
        run: python -m pip install poetry

      - name: Install dependencies
        run: poetry install --with dev

      - name: Run unit tests
        run: |
          poetry run pytest \
            tests/test_preprocessing_components.py \
            tests/test_basic_augmentations.py \
            tests/test_advanced_augmentations.py \
            tests/test_labeler_components.py
