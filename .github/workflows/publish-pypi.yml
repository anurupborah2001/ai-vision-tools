name: Publish To PyPI

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      repository_url:
        description: Optional repository URL, for example TestPyPI
        required: false
        default: ""
        type: string

jobs:
  publish:
    uses: ./.github/workflows/reusable-pypi-publish.yml
    with:
      python-version: "3.11"
      repository_url: ${{ inputs.repository_url || '' }}
