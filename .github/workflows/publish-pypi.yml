name: Publish to PyPI

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      repository_url:
        description: "Optional repository URL (e.g. https://test.pypi.org/legacy/ for TestPyPI)"
        required: false
        default: ""
        type: string

jobs:
  publish:
    permissions:
      contents: read
      id-token: write
    uses: ./.github/workflows/reusable-pypi-publish.yml
    with:
      python-version: "3.11"
      repository_url: ${{ inputs.repository_url || '' }}
