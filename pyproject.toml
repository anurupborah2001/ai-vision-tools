[build-system]
requires = ["poetry-core>=1.9.0"]
build-backend = "poetry.core.masonry.api"

[project]
name = "ai-vision-tool"
version = "0.2.0"
description = "Composable computer-vision pipeline components for image enhancement, motion analysis, capture, and dataset collection."
readme = "README.md"
requires-python = ">=3.10,<4.0"
authors = [
  { name = "AI Vision Flow Maintainers" },
]
keywords = ["computer-vision", "opencv", "image-processing", "dataset", "pipeline"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Developers",
  "Intended Audience :: Science/Research",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
  "Topic :: Scientific/Engineering :: Image Processing",
  "Topic :: Software Development :: Libraries :: Python Modules",
]
dependencies = [
  "numpy>=1.26",
  "opencv-python>=4.8",
  "pyyaml>=6.0",
]

[project.optional-dependencies]
onnx         = ["onnxruntime>=1.18"]
torch        = ["torch>=2.3", "torchvision>=0.18"]
tflite       = ["tflite-runtime>=2.14"]
websocket    = ["websockets>=12.0"]
kafka        = ["confluent-kafka>=2.3.0"]
streaming    = ["websockets>=12.0", "confluent-kafka>=2.3.0"]
cloud        = ["boto3>=1.34", "google-cloud-storage>=2.16"]
detection    = ["ultralytics>=8.0", "mediapipe>=0.10"]
segmentation = ["ultralytics>=8.0", "segment-anything>=1.0", "torch>=2.3", "torchvision>=0.18"]
tracking     = ["onnxruntime>=1.18"]
api          = ["fastapi>=0.115", "uvicorn>=0.30"]
all          = [
  "onnxruntime>=1.18",
  "torch>=2.3", "torchvision>=0.18",
  "websockets>=12.0", "confluent-kafka>=2.3.0",
  "boto3>=1.34", "google-cloud-storage>=2.16",
  "ultralytics>=8.0", "mediapipe>=0.10",
  "segment-anything>=1.0",
  "fastapi>=0.115", "uvicorn>=0.30",
]

[project.scripts]
ai-vision-tool = "ai_vision_tool.cli.main:main"

[tool.poetry]
name = "ai-vision-tool"
version = "0.2.0"
description = "Composable computer-vision pipeline components for image enhancement, motion analysis, capture, and dataset collection."
readme = "README.md"
authors = ["AI Vision Flow Maintainers"]
packages = [{ include = "ai_vision_tool" }]
keywords = ["computer-vision", "opencv", "image-processing", "dataset", "pipeline"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Developers",
  "Intended Audience :: Science/Research",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
  "Topic :: Scientific/Engineering :: Image Processing",
  "Topic :: Software Development :: Libraries :: Python Modules",
]

[tool.poetry.dependencies]
python = ">=3.10,<4.0"
numpy = ">=1.26"
opencv-python = ">=4.8"
pyyaml = ">=6.0"
onnxruntime = { version = ">=1.18", optional = true }
torch = { version = ">=2.3", optional = true }
torchvision = { version = ">=0.18", optional = true }
websockets = { version = ">=12.0", optional = true }
confluent-kafka = { version = ">=2.3.0", optional = true }
boto3 = { version = ">=1.34", optional = true }
google-cloud-storage = { version = ">=2.16", optional = true }
ultralytics = { version = ">=8.0", optional = true }
mediapipe = { version = ">=0.10", optional = true }
segment-anything = { version = ">=1.0", optional = true }
fastapi = { version = ">=0.115", optional = true }
uvicorn = { version = ">=0.30", optional = true }
tflite-runtime = { version = ">=2.14", optional = true }

[tool.poetry.group.dev.dependencies]
black = ">=24.8"
build = ">=1.2.1"
isort = ">=5.13"
pre-commit = ">=3.8"
pytest = ">=8.2"
ruff = ">=0.6.9"
twine = ">=5.1.1"
commitizen = ">=3.29"
httpx = ">=0.27"

[tool.poetry.extras]
onnx         = ["onnxruntime"]
torch        = ["torch", "torchvision"]
tflite       = ["tflite-runtime"]
websocket    = ["websockets"]
kafka        = ["confluent-kafka"]
streaming    = ["websockets", "confluent-kafka"]
cloud        = ["boto3", "google-cloud-storage"]
detection    = ["ultralytics", "mediapipe"]
segmentation = ["ultralytics", "segment-anything", "torch", "torchvision"]
tracking     = ["onnxruntime"]
api          = ["fastapi", "uvicorn"]
all          = ["onnxruntime", "torch", "torchvision", "websockets", "confluent-kafka",
               "boto3", "google-cloud-storage", "ultralytics", "mediapipe",
               "segment-anything", "fastapi", "uvicorn"]

[tool.poetry.scripts]
ai-vision-tool = "ai_vision_tool.cli.main:main"

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.black]
line-length = 88
target-version = ["py310"]

[tool.isort]
profile = "black"
line_length = 88

[tool.ruff]
line-length = 88
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[dependency-groups]
dev = [
    "black>=24.8",
    "build>=1.2.1",
    "commitizen>=3.29",
    "httpx>=0.27",
    "isort>=5.13",
    "pre-commit>=3.8",
    "pytest>=8.2",
    "ruff>=0.6.9",
    "twine>=5.1.1",
]
