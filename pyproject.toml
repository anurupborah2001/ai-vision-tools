[build-system]
requires = ["poetry-core>=1.9.0"]
build-backend = "poetry.core.masonry.api"

[project]
name = "ai-vision-tool"
version = "0.2.0"
description = "Composable computer-vision pipeline components for image enhancement, motion analysis, capture, and dataset collection."
readme = "README.md"
requires-python = ">=3.10,<4.0"
authors = [
  { name = "AI Vision Flow Maintainers" },
]
keywords = ["computer-vision", "opencv", "image-processing", "dataset", "pipeline"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Developers",
  "Intended Audience :: Science/Research",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
  "Topic :: Scientific/Engineering :: Image Processing",
  "Topic :: Software Development :: Libraries :: Python Modules",
]
dependencies = [
  "numpy>=1.26",
  "opencv-python>=4.8",
  "fastapi>=0.115",
  "uvicorn>=0.30",
]

[project.optional-dependencies]
tensorflow = ["tensorflow>=2.15"]

[project.scripts]
ai-vision-tool = "ai_vision_tool.cli:main"
ai-vision-tool-api = "ai_vision_tool.api:run"

[tool.poetry]
name = "ai-vision-tool"
version = "0.2.0"
description = "Composable computer-vision pipeline components for image enhancement, motion analysis, capture, and dataset collection."
readme = "README.md"
authors = ["AI Vision Flow Maintainers"]
packages = [{ include = "ai_vision_tool" }]
keywords = ["computer-vision", "opencv", "image-processing", "dataset", "pipeline"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Developers",
  "Intended Audience :: Science/Research",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
  "Topic :: Scientific/Engineering :: Image Processing",
  "Topic :: Software Development :: Libraries :: Python Modules",
]

[tool.poetry.dependencies]
python = ">=3.10,<4.0"
numpy = ">=1.26"
opencv-python = ">=4.8"
fastapi = ">=0.115"
uvicorn = ">=0.30"
tensorflow = { version = ">=2.15", optional = true }

[tool.poetry.group.dev.dependencies]
black = ">=24.8"
build = ">=1.2.1"
isort = ">=5.13"
pre-commit = ">=3.8"
pytest = ">=8.2"
ruff = ">=0.6.9"
twine = ">=5.1.1"
commitizen = ">=3.29"
httpx = ">=0.27"

[tool.poetry.extras]
tensorflow = ["tensorflow"]

[tool.poetry.scripts]
ai-vision-tool = "ai_vision_tool.cli:main"
ai-vision-tool-api = "ai_vision_tool.api:run"

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.black]
line-length = 88
target-version = ["py310"]

[tool.isort]
profile = "black"
line_length = 88

[tool.ruff]
line-length = 88
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[dependency-groups]
dev = [
    "black>=24.8",
    "build>=1.2.1",
    "commitizen>=3.29",
    "httpx>=0.27",
    "isort>=5.13",
    "pre-commit>=3.8",
    "pytest>=8.2",
    "ruff>=0.6.9",
    "twine>=5.1.1",
]
