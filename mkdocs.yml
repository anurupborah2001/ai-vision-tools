site_name: AI Vision Tool
site_url: https://anuborah.github.io/ai-vision-tools/
site_description: Composable computer-vision pipeline components for image enhancement, motion analysis, capture, and dataset collection.
site_author: AI Vision Tool Maintainers
repo_name: anuborah/ai-vision-tools
repo_url: https://github.com/anuborah/ai-vision-tools
edit_uri: edit/master/docs/

theme:
  name: material
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: indigo
      accent: blue
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: indigo
      accent: blue
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
  font:
    text: Inter
    code: JetBrains Mono
  logo: assets/logo.svg
  favicon: assets/logo.svg
  features:
    - announce.dismiss
    - content.action.edit
    - content.action.view
    - content.code.annotate
    - content.code.copy
    - content.tabs.link
    - content.tooltips
    - navigation.footer
    - navigation.indexes
    - navigation.instant
    - navigation.instant.prefetch
    - navigation.sections
    - navigation.tabs
    - navigation.tabs.sticky
    - navigation.top
    - navigation.tracking
    - search.highlight
    - search.share
    - search.suggest
    - toc.follow

exclude_docs: |
  superpowers/
  kami-overview-en.html

plugins:
  - search:
      separator: '[\s​\-_,:!=\[\]()"`/]+|\.(?!\d)|&[lg]t;|(?!\b)(?=[A-Z][a-z])'
  - mkdocstrings:
      handlers:
        python:
          options:
            docstring_style: google
            show_source: true
            show_root_heading: true
            show_root_toc_entry: true
            show_category_heading: true
            show_symbol_type_heading: true
            show_symbol_type_toc: true
            members_order: source
            inherited_members: false
            filters: ["!^_"]
            merge_init_into_class: true
            separate_signature: true
            show_signature_annotations: true
            signature_crossrefs: true
            unwrap_annotated: true
  - git-revision-date-localized:
      enable_creation_date: true
      enable_git_follow: false
      fallback_to_build_date: true
      type: timeago
  - minify:
      minify_html: true

markdown_extensions:
  - abbr
  - admonition
  - attr_list
  - def_list
  - footnotes
  - md_in_html
  - tables
  - toc:
      permalink: true
      title: On this page
  - pymdownx.arithmatex:
      generic: true
  - pymdownx.betterem:
      smart_enable: all
  - pymdownx.caret
  - pymdownx.details
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg
  - pymdownx.highlight:
      anchor_linenums: true
      line_spans: __span
      pygments_lang_class: true
  - pymdownx.inlinehilite
  - pymdownx.keys
  - pymdownx.magiclink:
      normalize_issue_symbols: true
      repo_url_shorthand: true
      user: anuborah
      repo: ai-vision-tools
  - pymdownx.mark
  - pymdownx.smartsymbols
  - pymdownx.snippets:
      auto_append:
        - docs/snippets/abbreviations.md
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.tabbed:
      alternate_style: true
      combine_header_slug: true
  - pymdownx.tasklist:
      custom_checkbox: true
  - pymdownx.tilde

extra:
  version:
    provider: mike
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/anuborah/ai-vision-tools
    - icon: fontawesome/brands/python
      link: https://pypi.org/project/ai-vision-tool/
  analytics:
    feedback:
      title: Was this page helpful?
      ratings:
        - icon: material/emoticon-happy-outline
          name: This page was helpful
          data: 1
          note: Thanks for your feedback!
        - icon: material/emoticon-sad-outline
          name: This page could be improved
          data: 0
          note: Let us know how to improve this page.

extra_css:
  - stylesheets/extra.css

nav:
  - Home: index.md
  - Getting Started:
    - Installation: installation.md
    - Quick Start: quickstart.md
    - CLI Reference: cli.md
  - User Guide:
    - user-guide/index.md
    - Preprocessing: user-guide/preprocessing.md
    - Augmentation: user-guide/augmentation.md
    - Detection: user-guide/detection.md
    - Tracking: user-guide/tracking.md
    - Segmentation: user-guide/segmentation.md
    - Pipelines: user-guide/pipelines.md
    - Capture: user-guide/capture.md
    - Enhancement: user-guide/enhancement.md
    - I/O: user-guide/io.md
    - Visualization: user-guide/visualization.md
    - Streaming: user-guide/streaming.md
    - Models: user-guide/models.md
    - Configuration: user-guide/config.md
    - Integrations: user-guide/integrations.md
    - Utilities: user-guide/utils.md
  - API Reference:
    - api/index.md
    - Core: api/core.md
    - Preprocessing: api/preprocessing.md
    - Augmentation: api/augmentation.md
    - Detection: api/detection.md
    - Tracking: api/tracking.md
    - Segmentation: api/segmentation.md
    - Pipelines: api/pipelines.md
    - Capture: api/capture.md
    - Enhancement: api/enhancement.md
    - I/O: api/io.md
    - Visualization: api/visualization.md
    - Streaming: api/streaming.md
    - Models: api/models.md
    - Configuration: api/config.md
    - Integrations: api/integrations.md
    - Utilities: api/utils.md
  - Contributing: contributing.md
